services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vkr
      POSTGRES_USER: vkr
      POSTGRES_PASSWORD: vkr
    volumes:
      - vkr_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vkr -d vkr"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://vkr:vkr@db:5432/vkr
      CORS_ORIGINS: http://localhost:3000
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_CHAT_MODEL: ${MISTRAL_CHAT_MODEL:-mistral-small-latest}
      MISTRAL_EMBEDDING_MODEL: ${MISTRAL_EMBEDDING_MODEL:-mistral-embed}
      DEMO_MODE: ${DEMO_MODE:-true}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_SHARE_WITH_EMAIL: ${GOOGLE_SHARE_WITH_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
        BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  vkr_postgres:
